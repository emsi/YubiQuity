name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install independent verifiers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-fido2 python3-cryptography python3-argon2 python3-nacl udev docker-compose-v2
          rustup show active-toolchain
      - name: Format, lint and test
        run: |
          bash -n scripts/install-dev-tools.sh scripts/install-firefox-esr.sh
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo build --locked
          /usr/bin/python3 tests/browser/test_rp.py
          /usr/bin/python3 tests/browser/test_ui.py
          /usr/bin/python3 tests/browser/test_public_sites.py
          /usr/bin/python3 tests/vault_crypto.py
          /usr/bin/python3 tests/packaging.py
          /usr/bin/python3 tests/container_seccomp.py
      - name: Audit production and fuzz dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
          cargo audit --file fuzz/Cargo.lock

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned fuzz tools
        run: |
          rustup toolchain install nightly-2026-10-19 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seeded ASan fuzz campaigns
        run: /usr/bin/python3 scripts/fuzz.py --seconds 120
      - name: Retain fuzz evidence and reproducer inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-results
          path: target/fuzz-results/
          if-no-files-found: ignore
          retention-days: 14
