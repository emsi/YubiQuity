[package]
name = "yubiquity"
version = "0.2.1"
edition = "2021"
rust-version = "1.99"
description = "Software-backed FIDO2 authenticator using Linux UHID"
publish = false

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
aes = { version = "0.8.4", features = ["zeroize"] }
cbc = { version = "0.1.2", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
ciborium = "0.2.2"
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"
hmac = "0.12.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rpassword = "7.5.4"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh", "std"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
